<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh;}

/* HEADER */
.hdr{background:#002776;padding:18px 16px;text-align:center;}
.hdr h1{color:#ffdf00;font-size:22px;line-height:1.3;}
.hdr h2{color:rgba(255,255,255,.8);font-size:13px;margin-top:4px;}
.hdr-sub{color:rgba(255,255,255,.6);font-size:11px;margin-top:6px;}

/* INFO STRIP */
.info{background:#ffdf00;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
.info-item{font-size:12px;font-weight:700;color:#002776;}
.info-update{font-size:11px;color:#555;font-style:italic;}

/* ALERT FINAL */
.alerta-final{background:linear-gradient(135deg,#8e44ad,#6c3483);color:#fff;margin:12px 12px 0;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.7;text-align:center;}
.alerta-final strong{color:#ffdf00;}

/* LOADING */
.loading{text-align:center;padding:40px;color:#888;font-size:14px;}
.loading .spinner{width:36px;height:36px;border:3px solid #dde1e7;border-top-color:#002776;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ERROR */
.error-box{background:#fff;border:2px solid #e74c3c;border-radius:12px;padding:20px;margin:20px 12px;text-align:center;}
.error-box h3{color:#e74c3c;margin-bottom:8px;}
.error-box p{font-size:13px;color:#555;line-height:1.6;}
.error-box code{background:#f8f8f8;padding:2px 6px;border-radius:4px;font-size:12px;color:#333;}

/* FILTRO */
.filtro-wrap{margin:12px 12px 0;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.filtro-label{font-size:12px;font-weight:700;color:#666;margin-bottom:6px;display:block;}
.filtro-sel{width:100%;padding:10px 12px;border:2px solid #dde1e7;border-radius:9px;font-size:15px;font-weight:600;color:#002776;background:#fff;outline:none;cursor:pointer;}
.filtro-sel:focus{border-color:#002776;}

/* TABS */
.tabs{display:flex;gap:0;margin:12px 12px 0;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.tab{flex:1;padding:11px 8px;text-align:center;font-size:13px;font-weight:700;background:#fff;border:none;cursor:pointer;color:#666;border-bottom:3px solid transparent;transition:all .2s;}
.tab.ativo{color:#002776;border-bottom-color:#002776;background:#f0f4ff;}

/* ===== CLASSIFICACAO ===== */
.classif-wrap{margin:10px 12px 0;}
.classif-header{display:grid;grid-template-columns:32px 1fr 52px 52px 52px;gap:4px;padding:6px 10px;background:#002776;border-radius:8px 8px 0 0;font-size:10px;font-weight:700;color:#ffdf00;letter-spacing:.5px;}
.classif-row{display:grid;grid-template-columns:32px 1fr 52px 52px 52px;gap:4px;padding:8px 10px;border-bottom:1px solid #eee;align-items:center;background:#fff;cursor:pointer;transition:background .15s;}
.classif-row:last-child{border-bottom:none;border-radius:0 0 8px 8px;}
.classif-row:hover{background:#f0f4ff;}
.classif-row.top1{background:linear-gradient(90deg,#fffbe6,#fff);}
.classif-row.top2{background:linear-gradient(90deg,#f5f5f5,#fff);}
.classif-row.top3{background:linear-gradient(90deg,#fff3e0,#fff);}
.pos{font-size:14px;font-weight:900;text-align:center;}
.pos.p1{color:#f1c40f;}
.pos.p2{color:#95a5a6;}
.pos.p3{color:#e67e22;}
.nome-cell{font-size:13px;font-weight:700;color:#002776;}
.pts-cell{font-size:15px;font-weight:900;text-align:center;color:#009c3b;}
.col-num{font-size:12px;font-weight:700;text-align:center;color:#555;}
.col-hint{font-size:9px;color:#aaa;text-align:center;}
.medalha{font-size:16px;text-align:center;}

/* ===== DETALHE PARTICIPANTE ===== */
.detalhe-wrap{margin:10px 12px 0;padding-bottom:20px;}
.detalhe-header{background:linear-gradient(135deg,#002776,#001550);border-radius:12px;padding:14px;color:#fff;text-align:center;margin-bottom:10px;}
.detalhe-header h3{color:#ffdf00;font-size:18px;font-weight:700;}
.detalhe-header .pts-big{font-size:36px;font-weight:900;color:#fff;margin:4px 0;}
.detalhe-header .pts-label{font-size:11px;color:rgba(255,255,255,.6);}
.detalhe-header .pos-badge{display:inline-block;background:#ffdf00;color:#002776;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;margin-top:6px;}

/* Final palpites card */

.palpites-finais-card h4{color:#ffdf00;font-size:13px;margin-bottom:10px;text-align:center;}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}

.pf-item .pf-pts{font-size:11px;color:#ffdf00;}
.pf-item .pf-status{font-size:10px;color:#f39c12;font-style:italic;}

/* Stats bar */

.stat-box{background:#fff;border-radius:9px;padding:9px 6px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.stat-num{font-size:20px;font-weight:900;color:#002776;}
.stat-lbl{font-size:10px;color:#888;font-weight:700;margin-top:1px;}

/* Jogos detalhe */

.jogo-detalhe{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:3px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.jd-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.jd-n{font-size:10px;color:#aaa;font-weight:700;}
.jd-data{font-size:10px;color:#bbb;}
.jd-body{display:flex;align-items:center;gap:6px;}
.jd-time{flex:1;font-size:11px;font-weight:700;color:#002776;line-height:1.2;}
.jd-time.a{text-align:right;}
.jd-placar{font-size:12px;font-weight:700;text-align:center;padding:3px 6px;border-radius:5px;min-width:44px;flex-shrink:0;}
.jd-placar.real{background:#002776;color:#fff;}
.jd-placar.palpite-ok-exato{background:#009c3b;color:#fff;}
.jd-placar.palpite-ok-venc{background:#f39c12;color:#fff;}
.jd-placar.palpite-errou{background:#e74c3c;color:#fff;}

.jd-pts.p3{color:#009c3b;}
.jd-pts.p1{color:#f39c12;}
.jd-pts.p0{color:#e74c3c;}

.jd-labels{display:flex;justify-content:space-between;font-size:9px;color:#bbb;margin-top:2px;padding:0 2px;}

.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#555;}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}

// =====================================================
// PARSER do resultados.txt
// =====================================================
function parseTxt(txt) {
  var linhas = txt.split('\n').map(function(l){ return l.trim(); });
  var data = {
    resultados: {},   // n -> {ga, gb}
    campea: "",
    vice: "",
    artilheiro: "",
    vice_artilheiro: "",
    participantes: [],
    atualizado: ""
  };

  var secao = null;
  var partAtual = null;

  for (var i = 0; i < linhas.length; i++) {
    var linha = linhas[i];
    if (!linha || linha.charAt(0) === '#') continue;

    // Detecta secoes
    if (linha === '[RESULTADOS]')       { secao = 'resultados'; continue; }
    if (linha === '[ARTILHEIRO]')       { secao = 'artilheiro'; continue; }
    if (linha === '[VICE_ARTILHEIRO]')  { secao = 'vice_artilheiro'; continue; }
    if (linha === '[CAMPEA]')           { secao = 'campea'; continue; }
    if (linha === '[VICE]')             { secao = 'vice'; continue; }
    if (linha === '[ATUALIZADO]')       { secao = 'atualizado'; continue; }
    if (linha === '[PARTICIPANTE]')     {
      secao = 'participante';
      partAtual = {nome:'', palpites:{}, campea:'', vice:'', artilheiro:'', vice_artilheiro:''};
      data.participantes.push(partAtual);
      continue;
    }

    // Processa conteudo
    if (secao === 'resultados') {
      var mR = linha.match(/^(\d+)\s+(\d+)\s*[xX]\s*(\d+)$/);
      if (mR) data.resultados[parseInt(mR[1])] = {ga: parseInt(mR[2]), gb: parseInt(mR[3])};
    }
    else if (secao === 'artilheiro')      { if (linha) data.artilheiro = linha; }
    else if (secao === 'vice_artilheiro') { if (linha) data.vice_artilheiro = linha; }
    else if (secao === 'campea')          { if (linha) data.campea = linha; }
    else if (secao === 'vice')            { if (linha) data.vice = linha; }
    else if (secao === 'atualizado')      { if (linha) data.atualizado = linha; }
    else if (secao === 'participante' && partAtual) {
      if (linha.toUpperCase().indexOf('NOME:') === 0) {
        partAtual.nome = linha.substring(5).trim();
      } else if (linha.toUpperCase().indexOf('CAMPEA:') === 0) {
        partAtual.campea = linha.substring(7).trim();
      } else if (linha.toUpperCase().indexOf('VICE:') === 0) {
        partAtual.vice = linha.substring(5).trim();
      } else if (linha.toUpperCase().indexOf('ARTILHEIRO:') === 0) {
        partAtual.artilheiro = linha.substring(11).trim();
      } else if (linha.toUpperCase().indexOf('VICE_ARTILHEIRO:') === 0) {
        partAtual.vice_artilheiro = linha.substring(16).trim();
      } else {
        var mP = linha.match(/^(\d+)\s+(\d+)\s*[xX]\s*(\d+)$/);
        if (mP) partAtual.palpites[parseInt(mP[1])] = {ga: parseInt(mP[2]), gb: parseInt(mP[3])};
      }
    }
  }
  return data;
}

// =====================================================
// CALCULA PONTUACAO
// =====================================================
function calcPontuacao(part, resultados) {
  var pts = 0, exatos = 0, vencedores = 0, erros = 0, jogados = 0;
  var detalhes = {};

  TODOS_JOGOS.forEach(function(j) {
    var res = resultados[j.n];
    var palp = part.palpites[j.n];
    if (!res || !palp) return;
    jogados++;
    var p = 0;
    var tipo = 'errou';

    var resVenc = res.ga > res.gb ? 'A' : res.ga < res.gb ? 'B' : 'E';
    var palVenc = palp.ga > palp.gb ? 'A' : palp.ga < palp.gb ? 'B' : 'E';

    if (res.ga === palp.ga && res.gb === palp.gb) {
      p = 3; exatos++; tipo = 'exato';
    } else if (resVenc === palVenc) {
      p = 1; vencedores++; tipo = 'vencedor';
    } else {
      erros++; tipo = 'errou';
    }
    pts += p;
    detalhes[j.n] = {pts: p, tipo: tipo};
  });

  return {pts: pts, exatos: exatos, vencedores: vencedores, erros: erros, jogados: jogados, detalhes: detalhes};
}

function compNormalizado(a, b) {
  return a.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    === b.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function calcPontuacaoFinal(part, data) {
  var base = calcPontuacao(part, data.resultados);
  var ptsFinal = 0;
  var finalApurado = data.campea || data.vice || data.artilheiro || data.vice_artilheiro;

  if (data.campea && compNormalizado(part.campea, data.campea)) ptsFinal += 5;
  if (data.vice && compNormalizado(part.vice, data.vice)) ptsFinal += 3;
  if (data.artilheiro && compNormalizado(part.artilheiro, data.artilheiro)) ptsFinal += 5;
  if (data.vice_artilheiro && compNormalizado(part.vice_artilheiro, data.vice_artilheiro)) ptsFinal += 3;

  return Object.assign({}, base, {
    ptsFinal: ptsFinal,
    ptsTotal: base.pts + ptsFinal,
    finalApurado: finalApurado
  });
}

// =====================================================
// ESTADO
// =====================================================
var DADOS = null;
var RANKINGS = [];
var VISTA_ATUAL = 'classif'; // 'classif' | 'detalhe'
var PART_SELECIONADO = null;

// =====================================================
// RENDER
// =====================================================
function render() {
  var app = document.getElementById('app');
  if (VISTA_ATUAL === 'classif') {
    app.innerHTML = renderClassif();
  } else {
    app.innerHTML = renderDetalhe(PART_SELECIONADO);
  }
  bindEvents();
}

function renderClassif() {
  var jogosApurados = Object.keys(DADOS.resultados).length;
  document.getElementById('info-jogos').textContent = '⚽ ' + jogosApurados + ' jogos apurados';
  document.getElementById('info-partic').textContent = '👥 ' + DADOS.participantes.length + ' participantes';
  document.getElementById('info-hora').textContent = DADOS.atualizado ? 'Atualizado: ' + DADOS.atualizado : '';
  document.getElementById('hdr-update').textContent = jogosApurados > 0
    ? jogosApurados + ' de 104 jogos apurados'
    : 'Aguardando início — 11/06/2026';

  var h = '';

  // Filtro
  h += '<div class="filtro-wrap">';
  h += '<span class="filtro-label">🔍 Ver pontuação detalhada de um participante:</span>';
  h += '<select class="filtro-sel" id="filtro-part">';
  h += '<option value="">-- Selecione um participante --</option>';
  RANKINGS.forEach(function(r) {
    h += '<option value="' + r.idx + '">' + r.nome + ' — ' + r.ptsTotal + ' pts</option>';
  });
  h += '</select></div>';

  // Classificação
  h += '<div class="classif-wrap">';
  h += '<div class="classif-header">';
  h += '<span>#</span><span>Participante</span>';
  h += '<span style="text-align:center">Pts<div class="col-hint">total</div></span>';
  h += '<span style="text-align:center">✓✓<div class="col-hint">exatos</div></span>';
  h += '<span style="text-align:center">✓<div class="col-hint">vencedor</div></span>';
  h += '</div>';

  RANKINGS.forEach(function(r, i) {
    var medalha = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
    var rowCls = 'classif-row' + (i === 0 ? ' top1' : i === 1 ? ' top2' : i === 2 ? ' top3' : '');
    var posCls = 'pos ' + (i === 0 ? 'p1' : i === 1 ? 'p2' : i === 2 ? 'p3' : '');
    h += '<div class="' + rowCls + '" data-idx="' + r.idx + '">';
    h += '<span class="' + posCls + '">' + (medalha || (i+1)) + '</span>';
    h += '<span class="nome-cell">' + esc(r.nome) + '</span>';
    h += '<span class="pts-cell">' + r.ptsTotal + '</span>';
    h += '<span class="col-num">' + r.exatos + '</span>';
    h += '<span class="col-num">' + r.vencedores + '</span>';
    h += '</div>';
  });
  h += '</div>';

  // Legenda pontos
  h += '<div class="legenda" style="margin:8px 12px 0;">';
  h += '<div class="leg-item"><div class="leg-dot" style="background:#009c3b"></div>Placar exato = 3pts</div>';
  h += '<div class="leg-item"><div class="leg-dot" style="background:#f39c12"></div>Vencedor/empate = 1pt</div>';
  h += '<div class="leg-item"><div class="leg-dot" style="background:#e74c3c"></div>Errou = 0pts</div>';
  h += '<div class="leg-item"><div class="leg-dot" style="background:#dde1e7"></div>Aguardando jogo</div>';
  h += '</div>';

  // Nota final
  if (!DADOS.campea) {
    h += '<div class="alerta-final" style="margin:10px 12px 16px;">';
    h += '⏳ Pontuações de <strong>Campeã (5pts), Vice (3pts), Artilheiro (5pts) e Vice-artilheiro (3pts)</strong>';
    h += '<br>serão adicionadas somente em <strong>' + DATA_FINAL + '</strong>';
    h += '</div>';
  }

  return h;
}

function renderDetalhe(idx) {
  var part = DADOS.participantes[idx];
  var calc = calcPontuacaoFinal(part, DADOS);
  var posicao = RANKINGS.findIndex(function(r){ return r.idx === idx; }) + 1;
  var totalParts = RANKINGS.length;

  var h = '<div class="detalhe-wrap">';

  // Header com botão voltar
  h += '<button class="btn-voltar-class" id="btn-voltar">← Voltar à classificação</button>';

  // Card do participante
  h += '<div class="detalhe-header">';
  h += '<h3>' + esc(part.nome) + '</h3>';
  h += '<div class="pts-big">' + calc.ptsTotal + '<span style="font-size:18px;color:rgba(255,255,255,.7)"> pts</span></div>';
  h += '<div class="pts-label">pontuação total</div>';
  h += '<div class="pos-badge">' + posicao + 'º de ' + totalParts + '</div>';
  h += '</div>';

  // Stats
  h += '<div class="stats-bar">';
  h += '<div class="stat-box"><div class="stat-num" style="color:#009c3b">' + calc.exatos + '</div><div class="stat-lbl">Exatos (3pts)</div></div>';
  h += '<div class="stat-box"><div class="stat-num" style="color:#f39c12">' + calc.vencedores + '</div><div class="stat-lbl">Vencedor (1pt)</div></div>';
  h += '<div class="stat-box"><div class="stat-num" style="color:#e74c3c">' + calc.erros + '</div><div class="stat-lbl">Errou</div></div>';
  h += '</div>';

  // Palpites finais
  h += '<div class="palpites-finais-card">';
  h += '<h4>🌟 Palpites Finais</h4>';
  h += '<div class="pf-grid">';

  var finais = [
    {label:'🏆 Campeã',    palpite: part.campea,           real: DADOS.campea,           pts: 5},
    {label:'🥈 Vice',      palpite: part.vice,             real: DADOS.vice,             pts: 3},
    {label:'⚽ Artilheiro',palpite: part.artilheiro,       real: DADOS.artilheiro,       pts: 5},
    {label:'🥅 Vice-Art',  palpite: part.vice_artilheiro,  real: DADOS.vice_artilheiro,  pts: 3},
  ];

  finais.forEach(function(fi) {
    var acertou = fi.real && compNormalizado(fi.palpite, fi.real);
    var ptsGanhos = acertou ? fi.pts : 0;
    h += '<div class="pf-item">';
    h += '<div class="pf-label">' + fi.label + '</div>';
    h += '<div class="pf-valor">' + esc(fi.palpite || '—') + '</div>';
    if (fi.real) {
      h += '<div class="pf-pts">' + (acertou ? '✅ +' + ptsGanhos + 'pts' : '❌ 0pts') + '</div>';
    } else {
      h += '<div class="pf-status">⏳ Apuração: ' + DATA_FINAL + '</div>';
    }
    h += '</div>';
  });

  h += '</div></div>';

  // Legenda
  h += '<div class="legenda">';
  h += '<div class="leg-item"><div class="leg-dot" style="background:#009c3b"></div>Exato (3pts)</div>';
  h += '<div class="leg-item"><div class="leg-dot" style="background:#f39c12"></div>Vencedor (1pt)</div>';
  h += '<div class="leg-item"><div class="leg-dot" style="background:#e74c3c"></div>Errou</div>';
  h += '<div class="leg-item"><div class="leg-dot" style="background:#dde1e7"></div>Aguardando</div>';
  h += '</div>';

  // Jogos por fase
  var faseAtual = null;
  TODOS_JOGOS.forEach(function(j) {
    var res = DADOS.resultados[j.n];
    var palp = part.palpites[j.n];
    var det = calc.detalhes[j.n];

    if (j.f !== faseAtual) {
      if (faseAtual !== null) h += '</div>'; // fecha bloco anterior
      faseAtual = j.f;
      h += '<span class="fase-titulo" style="background:' + CORES_FASE[j.f] + '">' + LABEL_FASE[j.f] + '</span>';
      h += '<div>';
    }

    var temRes = !!res;
    var temPalp = !!palp;
    var cls = 'jogo-detalhe' + (!temRes ? ' nao-jogado' : '');

    // placar real
    var placarReal = temRes ? res.ga + 'x' + res.gb : '—';
    // placar palpite
    var placarPalp = temPalp ? palp.ga + 'x' + palp.gb : '—';

    var palCls = 'palpite-aguarda';
    var ptsStr = '—'; var ptsCls = 'pa';
    if (det) {
      if (det.tipo === 'exato')    { palCls = 'palpite-ok-exato'; ptsStr = '+3'; ptsCls = 'p3'; }
      if (det.tipo === 'vencedor') { palCls = 'palpite-ok-venc';  ptsStr = '+1'; ptsCls = 'p1'; }
      if (det.tipo === 'errou')    { palCls = 'palpite-errou';    ptsStr = '0';  ptsCls = 'p0'; }
    }

    h += '<div class="' + cls + '">';
    h += '<div class="jd-top"><span class="jd-n">J' + j.n + '</span><span class="jd-data">' + j.d + '</span></div>';
    h += '<div class="jd-body">';
    h += '<span class="jd-time a">' + j.a + '</span>';
    h += '<div>';
    h += '<div class="jd-placar real">' + placarReal + '</div>';
    h += '<div class="jd-placar ' + palCls + '">' + placarPalp + '</div>';
    h += '</div>';
    h += '<span class="jd-time b">' + j.b + '</span>';
    h += '<span class="jd-pts ' + ptsCls + '">' + ptsStr + '</span>';
    h += '</div>';
    h += '<div class="jd-labels"><span>resultado</span><span>seu palpite</span></div>';
    h += '</div>';
  });
  if (faseAtual !== null) h += '</div>';

  h += '</div>'; // detalhe-wrap
  return h;
}

// =====================================================
// EVENTOS
// =====================================================
function bindEvents() {
  var filtro = document.getElementById('filtro-part');
  if (filtro) {
    filtro.addEventListener('change', function() {
      if (this.value !== '') {
        PART_SELECIONADO = parseInt(this.value);
        VISTA_ATUAL = 'detalhe';
        render();
        window.scrollTo(0,0);
      }
    });
  }

  // Clique nas linhas da classif
  document.querySelectorAll('.classif-row[data-idx]').forEach(function(el) {
    el.addEventListener('click', function() {
      PART_SELECIONADO = parseInt(this.getAttribute('data-idx'));
      VISTA_ATUAL = 'detalhe';
      render();
      window.scrollTo(0,0);
    });
  });

  var btnV = document.getElementById('btn-voltar');
  if (btnV) {
    btnV.addEventListener('click', function() {
      VISTA_ATUAL = 'classif';
      render();
      window.scrollTo(0,0);
    });
  }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// =====================================================
// CARREGA DADOS
// =====================================================
function carregarDados() {
  fetch(ARQUIVO_RESULTADOS + '?v=' + Date.now())
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(txt) {
      DADOS = parseTxt(txt);

      // Calcula rankings
      RANKINGS = DADOS.participantes.map(function(p, i) {
        var c = calcPontuacaoFinal(p, DADOS);
        return {idx: i, nome: p.nome, ptsTotal: c.ptsTotal, pts: c.pts,
                exatos: c.exatos, vencedores: c.vencedores, erros: c.erros};
      });
      RANKINGS.sort(function(a,b) {
        if (b.ptsTotal !== a.ptsTotal) return b.ptsTotal - a.ptsTotal;
        if (b.exatos !== a.exatos) return b.exatos - a.exatos;
        return a.nome.localeCompare(b.nome);
      });

      document.getElementById('info-hora').textContent =
        DADOS.atualizado ? 'Atualizado: ' + DADOS.atualizado : 'Ao vivo';

      VISTA_ATUAL = 'classif';
      render();
    })
    .catch(function(err) {
      document.getElementById('app').innerHTML =
        '<div class="error-box">'
        +'<h3>⚠️ Não foi possível carregar os resultados</h3>'
        +'<p>Verifique se o arquivo <code>resultados.txt</code> está na mesma pasta que este HTML no GitHub.</p>'
        +'<p style="margin-top:8px;color:#999;font-size:12px;">Erro: '+err.message+'</p>'
        +'</div>';
    });
}

// Inicia
carregarDados();
// Atualiza a cada 5 minutos
setInterval(carregarDados, 5 * 60 * 1000);
</script>
