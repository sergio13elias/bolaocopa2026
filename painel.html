// ===== PARSER =====
function parseTxt(txt){
  var ls=txt.split('\n').map(function(l){return l.trim();});
  var d={resultados:{},campea:'',vice:'',artilheiro:'',vice_artilheiro:'',participantes:[]};
  var sec=null,pt=null,ptFase=null;
  ls.forEach(function(l){
    if(!l||l[0]==='#')return;
    if(l==='[RESULTADOS]'){sec='r';return;}
    if(l==='[CAMPEA]'){sec='c';return;}if(l==='[VICE]'){sec='v';return;}
    if(l==='[ARTILHEIRO]'){sec='a';return;}if(l==='[VICE_ARTILHEIRO]'){sec='va';return;}
    if(l==='[FASES]'){sec='skip';return;}
    if(l==='[PARTICIPANTE]'){sec='pt';pt={nome:'',fase1:{},fase2:{},fase3:{},campea:'',vice:'',artilheiro:'',vice_artilheiro:''};d.participantes.push(pt);ptFase=null;return;}
    if(l==='[FASE1]'){ptFase='f1';return;}if(l==='[FASE2]'){ptFase='f2';return;}if(l==='[FASE3]'){ptFase='f3';return;}
    var mN=l.match(/^(\d+)\s+(\d+)[xX](\d+)/);
    if(sec==='r'&&mN)d.resultados[+mN[1]]={ga:+mN[2],gb:+mN[3]};
    else if(sec==='c'&&l)d.campea=l;else if(sec==='v'&&l)d.vice=l;
    else if(sec==='a'&&l)d.artilheiro=l;else if(sec==='va'&&l)d.vice_artilheiro=l;
    else if(sec==='pt'&&pt){
      var u=l.toUpperCase();
      if(u.startsWith('NOME:'))pt.nome=l.slice(5).trim();
      else if(u.startsWith('CAMPEA:'))pt.campea=l.slice(7).trim();
      else if(u.startsWith('VICE:'))pt.vice=l.slice(5).trim();
      else if(u.startsWith('ARTILHEIRO:'))pt.artilheiro=l.slice(11).trim();
      else if(u.startsWith('VICE_ARTILHEIRO:'))pt.vice_artilheiro=l.slice(16).trim();
      else if(mN&&ptFase){var o=ptFase==='f1'?pt.fase1:ptFase==='f2'?pt.fase2:pt.fase3;o[+mN[1]]={ga:+mN[2],gb:+mN[3]};}
    }
  });
  return d;
}

// ===== PONTUACAO =====
function calcFase(palpites,resultados,jogos){
  var pts=0,ex=0,vc=0,err=0;
  var det={};
  jogos.forEach(function(j){
    var r=resultados[j.n],p=palpites[j.n];
    if(!r||!p)return;
    var rv=r.ga>r.gb?'A':r.ga<r.gb?'B':'E';
    var pv=p.ga>p.gb?'A':p.ga<p.gb?'B':'E';
    var tipo='errou',pt2=0;
    if(r.ga===p.ga&&r.gb===p.gb){pt2=3;ex++;tipo='exato';}
    else if(rv===pv){pt2=1;vc++;tipo='vencedor';}
    else{err++;}
    pts+=pt2;det[j.n]={pts:pt2,tipo:tipo};
  });
  return{pts:pts,ex:ex,vc:vc,err:err,det:det};
}

function norm(s){
  return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function calcTotal(pt,dados){
  var c1=calcFase(pt.fase1,dados.resultados,JOGOS_F1);
  var c2=calcFase(pt.fase2,dados.resultados,JOGOS_F2);
  var c3=calcFase(pt.fase3,dados.resultados,JOGOS_F3);
  var pf=0;
  if(dados.campea&&norm(pt.campea)===norm(dados.campea))pf+=5;
  if(dados.vice&&norm(pt.vice)===norm(dados.vice))pf+=3;
  if(dados.artilheiro&&norm(pt.artilheiro)===norm(dados.artilheiro))pf+=5;
  if(dados.vice_artilheiro&&norm(pt.vice_artilheiro)===norm(dados.vice_artilheiro))pf+=3;
  return{c1:c1,c2:c2,c3:c3,pf:pf,
    total:c1.pts+c2.pts+c3.pts+pf,
    ex:c1.ex+c2.ex+c3.ex,vc:c1.vc+c2.vc+c3.vc,err:c1.err+c2.err+c3.err};
}

function bindEvents(){
  var sel=document.getElementById('filtro-sel');
  if(sel)sel.addEventListener('change',function(){
    if(this.value!==''){PART_SEL=+this.value;VISTA='det';render();window.scrollTo(0,0);}
  });
  document.querySelectorAll('.cl-row[data-idx]').forEach(function(el){
    el.addEventListener('click',function(){PART_SEL=+this.getAttribute('data-idx');VISTA='det';render();window.scrollTo(0,0);});
  });
  var bb=document.getElementById('btn-back');
  if(bb)bb.addEventListener('click',function(){VISTA='cl';render();window.scrollTo(0,0);});
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ===== CARREGAR =====
function carregar(){
  fetch(ARQ+'?nocache='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(txt){
      DADOS=parseTxt(txt);
      RANKINGS=DADOS.participantes.map(function(p,i){
        var c=calcTotal(p,DADOS);
        return{idx:i,nome:p.nome,total:c.total,ex:c.ex,vc:c.vc,
               pts1:c.c1.pts,pts2:c.c2.pts,pts3:c.c3.pts};
      });
      RANKINGS.sort(function(a,b){
        if(b.total!==a.total)return b.total-a.total;
        if(b.ex!==a.ex)return b.ex-a.ex;
        if(b.vc!==a.vc)return b.vc-a.vc;
        return a.nome.localeCompare(b.nome);
      });
      var jog=Object.keys(DADOS.resultados).length;
      document.getElementById('inf-jogos').textContent='\u26bd '+jog+'/104 jogos apurados';
      document.getElementById('inf-parts').textContent='\ud83d\udc65 '+DADOS.participantes.length+' participantes';
      document.getElementById('inf-hora').textContent='Atualizado: '+new Date().toLocaleTimeString('pt-BR');
      render();
    })
    .catch(function(e){
      document.getElementById('app').innerHTML='<div class="error-box">'
        +'<h3>\u26a0\ufe0f N\u00e3o foi poss\u00edvel carregar</h3>'
        +'<p>Verifique se o arquivo <code>resultados.txt</code> est\u00e1 no reposit\u00f3rio.</p>'
        +'<p style="margin-top:6px;color:#aaa;font-size:12px;">'+e.message+'</p>'
        +'</div>';
    });
}
carregar();
setInterval(carregar,5*60*1000);
